<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- 四个边角内的白色背景，提升图标在不同底色上的辨识度 -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="10" fill="#FFFFFF" />

  <!-- 内部精简声波：仅保留 3 根核心线条，加大间距，防止小尺寸下粘连 -->
  <g fill="none" stroke="#1BA5DE" stroke-width="3" stroke-linecap="round">
    <!-- 左侧短线 -->
    <line x1="11" y1="13" x2="11" y2="19" />
    <!-- 中间长线（核心视觉点） -->
    <line x1="16" y1="9"  x2="16" y2="23" stroke-width="4" />
    <!-- 右侧短线 -->
    <line x1="21" y1="13" x2="21" y2="19" />
  </g>
</svg>
