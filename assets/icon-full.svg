<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 1. 在四个直角围成的区域内填充高级白色背景（利用圆角正方形完美贴合边框） -->
  <rect x="30" y="30" width="140" height="140" rx="13" ry="13" fill="#F8F9FA"/>
  
  <!-- 2. 外部四个深蓝色圆角扫描边框（已严格数学对称，修复右下角） -->
  <g fill="none" stroke="#0D3B75" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左上角 -->
    <path d="M 68 35 L 48 35 A 13 13 0 0 0 35 48 L 35 68" />
    <!-- 右上角 -->
    <path d="M 132 35 L 152 35 A 13 13 0 0 1 165 48 L 165 68" />
    <!-- 左下角 -->
    <path d="M 35 132 L 35 152 A 13 13 0 0 0 48 165 L 68 165" />
    <!-- 右下角（已修正：终点精准落在 X=132, Y=165，完美对称不跑偏） -->
    <path d="M 165 132 L 165 152 A 13 13 0 0 1 152 165 L 132 165" />
  </g>

  <!-- 3. 中间亮蓝色音频波形刻度线（保持完全不动） -->
  <g fill="none" stroke="#1BA5DE" stroke-width="9" stroke-linecap="round">
    <line x1="48" y1="95" x2="48" y2="105" />
    <line x1="61" y1="91" x2="61" y2="109" />
    <line x1="74" y1="86" x2="74" y2="114" />
    <line x1="87" y1="81" x2="87" y2="119" />
    <!-- 正中间主轴（最长） -->
    <line x1="100" y1="65" x2="100" y2="135" stroke-width="10" />
    <line x1="113" y1="81" x2="113" y2="119" />
    <line x1="126" y1="86" x2="126" y2="114" />
    <line x1="139" y1="91" x2="139" y2="109" />
    <line x1="152" y1="95" x2="152" y2="105" />
  </g>
</svg>

